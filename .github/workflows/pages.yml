# Publishes site/ (Privacy Policy and Support pages) to GitHub Pages. Requires the repository's
# Settings → Pages → Source to be "GitHub Actions" (docs/PUBLIC_SITE.md). Only site/ is published;
# the engineering docs under docs/ are never part of the Pages artifact.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "scripts/package-pages-artifact.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Normalize archive permissions and reject links/special files before upload.
      - name: Package public site
        run: python3 scripts/package-pages-artifact.py --site site --output "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          archive: true
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    timeout-minutes: 10
    # Dispatches from other branches cannot deploy or mint a Pages OIDC token.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
