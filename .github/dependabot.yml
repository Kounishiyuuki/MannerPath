version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /services/api
    schedule:
      interval: weekly
    # Preserve exact direct versions; every change still requires review and CI.
    versioning-strategy: increase
    open-pull-requests-limit: 5
